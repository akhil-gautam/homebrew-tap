name: Auto-update justsearch cask

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump cask to the latest JustSearch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CASK=Casks/justsearch.rb

          TAG=$(gh api repos/akhil-gautam/justsearch/releases/latest --jq .tag_name)
          VERSION="${TAG#v}"
          URL="https://github.com/akhil-gautam/justsearch/releases/download/${TAG}/JustSearch-${TAG}.zip"

          CURRENT=$(awk -F'"' '/^  version/{print $2}' "$CASK")
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "Cask already at $VERSION — nothing to do."
            exit 0
          fi

          SHA=$(curl -fsSL "$URL" | shasum -a 256 | awk '{print $1}')
          [ -n "$SHA" ] || { echo "error: could not checksum $URL" >&2; exit 1; }

          sed -i "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK"
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK"

          git config user.name "tap-updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK"
          git commit -m "justsearch ${VERSION}"
          git push
          echo "Bumped justsearch ${CURRENT} → ${VERSION} (${SHA})"
